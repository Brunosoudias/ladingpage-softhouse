<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>BR Coder — post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #0b0b0f;
      }

      #post {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #0b0b0f;
        color: #fafafa;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 54px 54px;
        mask-image: radial-gradient(ellipse 80% 70% at 30% 45%, #000 20%, transparent 75%);
      }

      .glow {
        position: absolute;
        top: 180px;
        left: -80px;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.045);
        filter: blur(90px);
      }

      .frame {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 76px 84px 72px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .mark {
        display: grid;
        width: 76px;
        height: 76px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 50%;
        background: #0a0a0c;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.06em;
      }

      .brand {
        color: #8a8a93;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .copy {
        margin-top: auto;
        margin-bottom: auto;
      }

      .setup {
        color: #8a8a93;
        font-size: 92px;
        font-weight: 600;
        letter-spacing: -0.048em;
        line-height: 0.94;
      }

      .payoff {
        margin-top: 56px;
        color: #fafafa;
        font-size: 92px;
        font-weight: 600;
        letter-spacing: -0.048em;
        line-height: 0.94;
      }

      .rule {
        width: 72px;
        height: 1px;
        margin-top: 72px;
        background: rgba(255, 255, 255, 0.28);
      }

      .support {
        margin-top: 32px;
        color: #d4d4d8;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.35;
      }

      .footer {
        color: #8a8a93;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <article id="post">
      <div class="grid"></div>
      <div class="glow"></div>
      <div class="frame">
        <header class="top">
          <div class="mark">br_</div>
          <p class="brand">BR Coder</p>
        </header>

        <div class="copy">
          <h1 class="setup">
            Entrar em produção<br />
            não é o fim.
          </h1>
          <p class="payoff">
            É o começo<br />
            da operação.
          </p>
          <div class="rule"></div>
          <p class="support">
            Software sob medida.<br />
            Infraestrutura no ar.
          </p>
        </div>

        <footer class="footer">brcoder.com.br</footer>
      </div>
    </article>
  </body>
</html>
